<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Plataforma em HTML</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            background-color: #34495e;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Configurações da Física
    const gravity = 0.5;
    const friction = 0.8;

    // Jogador
    const player = {
        x: 50,
        y: 200,
        width: 30,
        height: 30,
        velocityX: 0,
        velocityY: 0,
        speed: 2,
        jumpForce: -10,
        grounded: false,
        jumping: false,
        color: "#e74c3c"
    };

    // Teclas pressionadas
    const keys = {
        right: false,
        left: false,
        up: false
    };

    // Plataformas do jogo [x, y, width, height]
    const platforms = [
        [0, 380, 800, 20],   // Chão
        [100, 300, 150, 20],  // Plataforma 1
        [300, 220, 200, 20],  // Plataforma 2
        [550, 150, 150, 20],  // Plataforma 3
        [150, 100, 120, 20]   // Plataforma 4
    ];

    // Detecção de colisão entre dois retângulos
    function getRectCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    // Função de Loop do jogo
    function update() {
        // 1. Física e Movimentação Horizontal
        if (keys.right) {
            player.velocityX += player.speed;
        }
        if (keys.left) {
            player.velocityX -= player.speed;
        }

        player.velocityX *= friction;
        player.x += player.velocityX;

        // 2. Física e Movimentação Vertical (Gravidade e Pulo)
        player.velocityY += gravity;
        player.y += player.velocityY;
        player.grounded = false;

        // 3. Checagem de colisão com as plataformas
        for (let i = 0; i < platforms.length; i++) {
            let platform = platforms[i];
            let platObj = {x: platform[0], y: platform[1], width: platform[2], height: platform[3]};

            if (getRectCollision(player, platObj)) {
                // Colisão pelo topo do jogador
                if (player.velocityY > 0 && player.y + player.height - player.velocityY <= platObj.y) {
                    player.y = platObj.y - player.height;
                    player.velocityY = 0;
                    player.grounded = true;
                    player.jumping = false;
                }
            }
        }

        // Limites da tela nas laterais
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Limite de queda (Game Over / Reiniciar)
        if (player.y > canvas.height) {
            player.x = 50;
            player.y = 200;
            player.velocityY = 0;
        }

        // 4. Renderização (Desenhar na tela)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar jogador
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // Desenhar plataformas
        ctx.fillStyle = "#2ecc71";
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            ctx.fillRect(p[0], p[1], p[2], p[3]);
        }

        requestAnimationFrame(update);
    }

    // Controles pelo teclado (Apertar)
    document.addEventListener("keydown", function(e) {
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
        if ((e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") && player.grounded && !player.jumping) {
            player.velocityY = player.jumpForce;
            player.grounded = false;
            player.jumping = true;
        }
    });

    // Controles pelo teclado (Soltar)
    document.addEventListener("keyup", function(e) {
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    });

    // Iniciar o jogo
    update();
</script>

</body>
</html>
